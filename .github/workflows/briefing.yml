name: Morning Briefing

on:
  schedule:
    - cron: "37 4 * * *"   # ~06:37 Uhr DE (Sommerzeit); im Winter 05:37
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  briefing:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Code auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Abhaengigkeiten installieren
        run: pip install -r requirements.txt

      - name: Briefing bauen (HTML + MP3, ohne Push)
        env:
          TTS_VOICE: de-DE-ConradNeural
          PHASE: build
        run: python briefing.py

      - name: Seite fuer GitHub Pages vorbereiten
        run: |
          mkdir -p _site
          cp briefings/briefing.html _site/index.html

      - name: Pages konfigurieren
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Seite als Pages-Artefakt hochladen
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Auf GitHub Pages veroeffentlichen
        id: deploy
        uses: actions/deploy-pages@v4

      - name: Push senden (mit Link zur veroeffentlichten Seite)
        env:
          TTS_VOICE: de-DE-ConradNeural
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          PHASE: send
          CLICK_URL: ${{ steps.deploy.outputs.page_url }}
        run: python briefing.py
